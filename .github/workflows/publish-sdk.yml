name: Publish SDK

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.repository == 'cashubtc/npubcash-server' &&
      startsWith(github.event.release.tag_name, 'npubcash-sdk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify SDK release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const prefix = "npubcash-sdk-v";
          const tag = process.env.RELEASE_TAG ?? "";
          const version = tag.slice(prefix.length);
          const stableSemver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const packageJson = JSON.parse(
            readFileSync("packages/sdk/package.json", "utf8"),
          );

          if (!tag.startsWith(prefix) || !stableSemver.test(version)) {
            throw new Error(
              `SDK releases must use ${prefix}<major>.<minor>.<patch>; received ${tag}`,
            );
          }
          if (packageJson.version !== version) {
            throw new Error(
              `Release tag version ${version} does not match SDK version ${packageJson.version}`,
            );
          }
          EOF
      - name: Verify packed SDK consumer
        run: bun run --cwd packages/sdk test:package
      - name: Publish SDK
        working-directory: packages/sdk
        run: npm publish --access public
