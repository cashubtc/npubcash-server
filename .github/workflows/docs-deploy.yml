name: Deploy documentation

on:
  push:
    branches:
      - v3
    paths:
      - .github/workflows/docs-deploy.yml
      - bun.lock
      - package.json
      - packages/docs/**
      - packages/sdk/src/**
      - packages/server/src/**
      - packages/types/src/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check documentation
        run: bun run --cwd packages/docs check
      - name: Build documentation
        run: bun run --cwd packages/docs build
        env:
          VITEPRESS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/docs/.vitepress/dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
