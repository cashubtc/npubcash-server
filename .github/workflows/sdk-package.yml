name: SDK package

on:
  pull_request:
    paths:
      - "packages/sdk/**"
      - "packages/types/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/sdk-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify packed SDK consumer
        run: bun run --cwd packages/sdk test:package
